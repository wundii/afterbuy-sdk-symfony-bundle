afterbuy_sdk:
  afterbuy_global:
    accountToken: <your_account_token>
    partnerToken: <your_partner_token>
    endpointEnum: sandbox
    errorLanguageEnum: DE
  logger_interface:
  validatorBuilder:
  debug_mode: false
  class_map:
    DateTimeInterface: Wundii\AfterbuySdk\Extension\DateTime

when@test:
  afterbuy_sdk:
    afterbuy_global:
      endpointEnum: sandbox

when@prod:
  afterbuy_sdk:
    afterbuy_global:
      endpointEnum: prod